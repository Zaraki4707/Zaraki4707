<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Orbit animation">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#121a3a"/>
      <stop offset="100%" stop-color="#050812"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="800" height="220" rx="20" fill="url(#space)"/>

  <g transform="translate(400,110)">
    <circle r="24" fill="#ffd166" filter="url(#glow)"/>
    <circle r="12" fill="#ffe7a3" opacity="0.9"/>

    <ellipse rx="80" ry="32" fill="none" stroke="#5c6bc0" stroke-width="1.8" opacity="0.7"/>
    <ellipse rx="120" ry="52" fill="none" stroke="#8e99f3" stroke-width="1.5" opacity="0.55"/>
    <ellipse rx="165" ry="72" fill="none" stroke="#b39ddb" stroke-width="1.2" opacity="0.4"/>

    <g>
      <circle cx="80" cy="0" r="6" fill="#80deea"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>

    <g>
      <circle cx="120" cy="0" r="7" fill="#a5d6a7"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6.5s" repeatCount="indefinite"/>
    </g>

    <g>
      <circle cx="165" cy="0" r="8" fill="#ce93d8"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="#dfe7fd" opacity="0.75">
    <circle cx="60" cy="45" r="1.4"/>
    <circle cx="130" cy="170" r="1.2"/>
    <circle cx="230" cy="70" r="1.1"/>
    <circle cx="305" cy="180" r="1.3"/>
    <circle cx="510" cy="35" r="1.2"/>
    <circle cx="575" cy="165" r="1.1"/>
    <circle cx="690" cy="85" r="1.4"/>
    <circle cx="745" cy="155" r="1.2"/>
  </g>
</svg>
